    /* CSS Variables for Dynamic Dark & Light Theme */
    :root {
      --bg-page: #F8FAFC;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --bg-input: #FFFFFF;
      --border-main: #E2E8F0;
      --border-subtle: #F1F5F9;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-sub: #475569;
      --shadow-elevation: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radio-bg: #F8FAFC;
      --radio-hover: #F1F5F9;
    }

    html.dark {
      --bg-page: #090D16;
      --bg-sidebar: #111827;
      --bg-card: #111827;
      --bg-card-hover: #172033;
      --bg-input: #0F172A;
      --border-main: #1F2937;
      --border-subtle: #1A2234;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-sub: #CBD5E1;
      --shadow-elevation: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
      --radio-bg: rgba(15, 23, 42, 0.6);
      --radio-hover: rgba(255, 255, 255, 0.05);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
    }

    .theme-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-main);
      box-shadow: var(--shadow-card);
    }

    .theme-sidebar {
      background-color: var(--bg-sidebar);
      border-color: var(--border-main);
    }

    .theme-input {
      background-color: var(--bg-input);
      border-color: var(--border-main);
      color: var(--text-main);
    }

    .theme-border {
      border-color: var(--border-main);
    }

    .theme-text-muted {
      color: var(--text-muted);
    }

    .theme-text-sub {
      color: var(--text-sub);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #94A3B8;
      border-radius: 9999px;
    }

    html.dark ::-webkit-scrollbar-thumb {
      background: #4B5563;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748B;
    }

    /* Smooth Transitions */
    * {
      transition-property: background-color, border-color, color, fill, stroke, box-shadow;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 150ms;
    }

    /* Animation for toast */
    @keyframes slideInRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-toast {
      animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom styles for charts container */
    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
    }

    /* Modern radio button cards */
    .radio-card input:checked+label {
      border-color: #6366f1 !important;
      background: rgba(99, 102, 241, 0.12) !important;
      color: #6366f1 !important;
      box-shadow: 0 0 0 1px #6366f1;
    }

    html.dark .radio-card input:checked+label {
      color: #818cf8 !important;
      background: rgba(99, 102, 241, 0.18) !important;
    }
  </style>

          d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
        }
        h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
        h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
      }
      const out = new Uint8Array(32);
      const outView = new DataView(out.buffer);
      [h0, h1, h2, h3, h4, h5, h6, h7].forEach((v, idx) => outView.setUint32(idx * 4, v, false));
      return out;
    }

    function concatUint8Arrays(a, b) {
      const res = new Uint8Array(a.length + b.length);
      res.set(a, 0);
      res.set(b, a.length);
      return res;
    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) {
        out[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return out;
    }

    function base64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        out[i] = bin.charCodeAt(i);
      }
      return out;
    }

    function deriveVaultKeyBytes(username, password) {
      const enc = new TextEncoder();
      const normalizedUser = String(username || "").trim().toLowerCase();
      const saltBytes = enc.encode(`${AUTH_SALT}::${normalizedUser}::${password}`);
      let key = sha256Bytes(saltBytes);
      for (let i = 0; i < 4096; i++) {
        key = sha256Bytes(concatUint8Arrays(key, saltBytes));
      }
      return key;
    }

    function decryptVaultWithKeyBytes(keyBytes) {
      try {
        const enc = new TextEncoder();
        const verifyHex = bytesToHex(sha256Bytes(concatUint8Arrays(keyBytes, enc.encode("::verify"))));
        if (verifyHex !== AUTH_VERIFY_HASH) {
          return null;
        }
        const cipherBytes = base64ToBytes(ENCRYPTED_VAULT_B64);
        const plainBytes = new Uint8Array(cipherBytes.length);
        const blockInput = new Uint8Array(keyBytes.length + 6);
        blockInput.set(keyBytes, 0);
        blockInput[keyBytes.length] = 0x3a;
        blockInput[keyBytes.length + 1] = 0x73;
        const view = new DataView(blockInput.buffer);

        let blockIndex = 0;
        for (let offset = 0; offset < cipherBytes.length; offset += 32) {
          view.setUint32(keyBytes.length + 2, blockIndex >>> 0, false);
          const keyStreamBlock = sha256Bytes(blockInput);
          const chunkLen = Math.min(32, cipherBytes.length - offset);
          for (let j = 0; j < chunkLen; j++) {
            plainBytes[offset + j] = cipherBytes[offset + j] ^ keyStreamBlock[j];
          }
          blockIndex++;
        }

        const decodedJson = new TextDecoder().decode(plainBytes);
        const vault = JSON.parse(decodedJson);
        if (vault && vault.s === "BEEVERIFY_SEC_OK") {
          return vault;
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    function toggleAuthPasswordVisibility() {
      const pwdInput = document.getElementById("current-password");
      const toggleBtn = document.getElementById("btnTogglePassword");
      const toggleText = document.getElementById("togglePasswordText");
      if (!pwdInput || !toggleBtn || !toggleText) return;

      const isShowing = pwdInput.type === "text";
      if (isShowing) {
        pwdInput.type = "password";
        toggleBtn.setAttribute("aria-label", "Show password");
        toggleBtn.setAttribute("aria-pressed", "false");
        toggleText.textContent = "Show";
      } else {
        pwdInput.type = "text";
        toggleBtn.setAttribute("aria-label", "Hide password");
        toggleBtn.setAttribute("aria-pressed", "true");
        toggleText.textContent = "Hide";
      }
      pwdInput.focus();
    }

    function initTheme() {
      const savedTheme = localStorage.getItem("calltrack_theme") || "dark";
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      const isDark = (theme === "dark");
      if (isDark) {
        document.documentElement.classList.add("dark");
        document.documentElement.classList.remove("light");
        localStorage.setItem("calltrack_theme", "dark");
        document.getElementById("themeIconSun")?.classList.remove("hidden");
        document.getElementById("themeIconMoon")?.classList.add("hidden");
        const txt = document.getElementById("themeToggleText");
        if (txt) txt.textContent = "Light Mode";
        document.getElementById("mobileThemeIconSun")?.classList.remove("hidden");
        document.getElementById("mobileThemeIconMoon")?.classList.add("hidden");
      } else {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        localStorage.setItem("calltrack_theme", "light");
        document.getElementById("themeIconSun")?.classList.add("hidden");
        document.getElementById("themeIconMoon")?.classList.remove("hidden");
        const txt = document.getElementById("themeToggleText");
        if (txt) txt.textContent = "Dark Mode";
        document.getElementById("mobileThemeIconSun")?.classList.add("hidden");
        document.getElementById("mobileThemeIconMoon")?.classList.remove("hidden");
      }
      if (typeof currentTab !== "undefined" && currentTab === "dashboard" && typeof renderDashboard === "function") {
        renderDashboard();
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains("dark");
      applyTheme(isDark ? "light" : "dark");
      if (typeof showToast === "function") {
        showToast(`Switched to ${isDark ? "Light" : "Dark"} theme.`, "info");
      }
    }

    function unlockWorkspaceWithVault(vault) {
      isAppAuthenticated = true;

      if (!isWorkspaceMounted) {
        isWorkspaceMounted = true;

        if (vault.svg) {
          const defs = document.querySelector("#appEmbeddedSvgSymbols defs");
          if (defs) {
            defs.insertAdjacentHTML("beforeend", vault.svg);
          }
        }

        const mountEl = document.getElementById("encryptedWorkspaceMount");
        if (mountEl) {
          mountEl.innerHTML = vault.html;
        }

        const scriptEl = document.createElement("script");
        scriptEl.textContent = vault.js;
        document.body.appendChild(scriptEl);
      }

      const overlay = document.getElementById("authLoginOverlay");
      const mobileHeader = document.getElementById("mobileTopHeader");
      const sidebar = document.getElementById("appSidebar");
      const mainContent = document.getElementById("appMainContent");
      const userLabel = document.getElementById("sidebarActiveUserLabel");

      if (overlay) overlay.classList.add("hidden");
      if (mobileHeader) mobileHeader.classList.remove("hidden");
      if (sidebar) sidebar.classList.remove("hidden");
      if (mainContent) mainContent.classList.remove("hidden");
      if (userLabel && vault.u) {
        userLabel.textContent = `${vault.u} • Protected`;
      }

      if (typeof openDbAndInitApp === "function") {
        openDbAndInitApp();
      }
    }

    function handleAuthLogin(event) {
      if (event) event.preventDefault();
      const userEl = document.getElementById("auth-username");
      const passEl = document.getElementById("current-password");
      const rememberEl = document.getElementById("authRememberSession");
      const errBox = document.getElementById("authErrorBox");
      const errText = document.getElementById("authErrorText");

      const username = userEl ? userEl.value : "";
      const password = passEl ? passEl.value : "";

      const keyBytes = deriveVaultKeyBytes(username, password);
      const vault = decryptVaultWithKeyBytes(keyBytes);

      if (!vault) {
        if (errText) errText.textContent = "Invalid username or password. Access denied.";
        if (errBox) errBox.class.remove("hidden");
        if (passEl) {
          passEl.value = "";
          passEl.focus();
        }
        return;
      }

      if (errBox) errBox.classList.add("hidden");

      const keyHex = bytesToHex(keyBytes);
      try {
        sessionStorage.setItem(AUTH_SESSION_STORAGE_KEY, keyHex);
        if (rememberEl && rememberEl.checked) {
          localStorage.setItem(AUTH_SESSION_STORAGE_KEY, keyHex);
        } else {
          localStorage.removeItem(AUTH_SESSION_STORAGE_KEY);
        }
      } catch (e) {
        // Ignore storage quota errors
      }

      if (passEl) {
        passEl.type = "password";
        passEl.value = "";
      }
      const toggleBtn = document.getElementById("btnTogglePassword");
      const toggleText = document.getElementById("togglePasswordText");
      if (toggleBtn) {
        toggleBtn.setAttribute("aria-label", "Show password");
        toggleBtn.setAttribute("aria-pressed", "false");
      }
      if (toggleText) toggleText.textContent = "Show";

      unlockWorkspaceWithVault(vault);
      if (typeof showToast === "function") {
        showToast(`Authenticated as ${vault.u}. Workspace decrypted.`, "success");
      }
    }

    function handleAuthLogout() {
      isAppAuthenticated = false;
      try {
        sessionStorage.removeItem(AUTH_SESSION_STORAGE_KEY);
        localStorage.removeItem(AUTH_SESSION_STORAGE_KEY);
      } catch (e) {
        // Ignore storage errors
      }
      window.location.reload();
    }

    function initAuthGate() {
      initTheme();
      try {
        const storedKeyHex = sessionStorage.getItem(AUTH_SESSION_STORAGE_KEY) || localStorage.getItem(AUTH_SESSION_STORAGE_KEY);
        if (storedKeyHex && storedKeyHex.length === 64) {
          const keyBytes = hexToBytes(storedKeyHex);
          const vault = decryptVaultWithKeyBytes(keyBytes);
          if (vault) {
            unlockWorkspaceWithVault(vault);
            return;
          }
        }
      } catch (e) {
        // Ignore storage read errors
      }
      const userEl = document.getElementById("auth-username");
      if (userEl) userEl.focus();
    }

    initAuthGate();
  </script>
</body>
